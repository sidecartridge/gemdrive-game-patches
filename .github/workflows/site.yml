name: Site

# The website (tools/site/build_site.py): built from the notes, the survey's tables and our sources,
# and checked (every link and anchor, every game's row, no page loading another site, no reference
# to the planning notes or to the adaptations' author). The patcher's blocks are assembled from our sources
# with the pinned toolchain (tools/dev/toolchain.sh). Runs on every pull request and every push to
# main. It publishes nothing: tools/site/deploy_site.sh publishes the site, with its snapshots, on gh-pages.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: The pinned toolchain
      run: docker pull logronoide/atarist-toolkit-docker-x86_64:1.5.0@sha256:5b5806bfc6c84c2cf2cebf34f13c7ea472d88d8d02ccc9f0ad71572654e215ad
    - name: Build and check the site
      run: python3 tools/site/build_site.py --out _site --no-snapshots --check
